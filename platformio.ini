; PlatformIO project lives in /firmware so this root file just points there.
[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = waveshare-s3-touch-lcd-7

[env:waveshare-s3-touch-lcd-7]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
lib_ldf_mode = deep+
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -D ARDUINOJSON_ENABLE_PSRAM=1
    -I firmware/include
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.3.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    https://github.com/esp-arduino-libs/esp-lib-utils.git
