; PlatformIO project lives in /firmware so this root file just points there.
[platformio]
; Short core path avoids Windows MAX_PATH failures unpacking esp32-arduino-libs
core_dir = C:/Users/dbvan/p
src_dir = firmware/src
include_dir = firmware/include
default_envs = crowpanel-p4-10

[env:waveshare-s3-touch-lcd-7]
; pioarduino HybridCompile rebuilds IDF libs so CONFIG_SPIRAM_XIP_FROM_PSRAM can take effect
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.psram_type = opi
lib_ldf_mode = deep+
; Enable XiP from PSRAM. Requires HybridCompile (not a -D flag alone).
custom_sdkconfig =
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
	CONFIG_SPIRAM_RODATA=y
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -D ARDUINOJSON_ENABLE_PSRAM=1
    -I firmware/include
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.3.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    https://github.com/esp-arduino-libs/esp-lib-utils.git

[env:crowpanel-p4-10]
; Elecrow CrowPanel Advanced 10.1" ESP32-P4 (1024x600 EK79007 MIPI-DSI, GT911, ESP32-C6 Wi-Fi)
; Board ROM is eco2 — use ES (pre-rev.300) libs at 360 MHz, not esp32-p4_r3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
upload_port = COM5
monitor_port = COM5
board_build.mcu = esp32p4
board_build.chip_variant = esp32p4_es
board_build.variant = crowpanel_p4
board_build.variants_dir = firmware/variants
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 360000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Pre-seed plate bitmaps (data/p_ICAO.frpl) — Upload Plates can still refresh over Wi‑Fi.
board_build.filesystem = spiffs
lib_ldf_mode = deep+
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_CROWPANEL_P4
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -D ARDUINOJSON_ENABLE_PSRAM=1
    -I firmware/include
    -IC:/Users/dbvan/p/packages/framework-arduinoespressif32/libraries/Network/src
    -IC:/Users/dbvan/p/packages/framework-arduinoespressif32/libraries/NetworkClientSecure/src
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.3.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    https://github.com/esp-arduino-libs/esp-lib-utils.git
